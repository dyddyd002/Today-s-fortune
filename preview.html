<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오늘의 운세</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #2c1650;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color: #fff5e6;
  display: flex;
  align-items: center;
  justify-content: center;
}
main { display: flex; flex-direction: column; align-items: center; gap: 20px; }
h1 { font-size: 22px; letter-spacing: 2px; margin: 0; }
.scene { width: 280px; height: 380px; perspective: 1200px; cursor: pointer; }
.card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(.4,.2,.2,1); }
.card.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
.face.front { background: #c98b1f; color: #3a1f0a; font-weight: 700; }
.face.back { background: #58245c; border: 2px solid #ffd977; transform: rotateY(180deg); }
.label { font-size: 12px; letter-spacing: 2px; color: #ffd977; text-transform: uppercase; }
button { padding: 12px 28px; border-radius: 999px; border: none; background: #ffd977; color: #3a1f0a; font-weight: 700; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<main>
<h1>오늘의 운세</h1>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="face front">카드를 눌러보세요</div>
<div class="face back">
<div class="label">오늘의 운세</div>
<div id="fortune">...</div>
<div class="label">행운의 아이템 / 색</div>
<div id="lucky" style="font-weight:700;">...</div>
</div>
</div>
</div>
<button id="btn">운세 뽑기</button>
</main>
<script>
const fortunes = ["오늘은 뜻밖의 좋은 소식이 찾아올 거예요.","작은 용기가 큰 변화를 만드는 하루입니다.","그동안의 노력이 서서히 결실을 맺기 시작합니다.","새로운 인연이 다가올 수 있으니 주변을 잘 살펴보세요.","재물운이 상승하는 시기, 충동적인 소비는 조심하세요.","몸과 마음의 휴식이 필요한 때입니다.","막혔던 일이 실마리를 찾아 술술 풀리기 시작합니다.","주변 사람의 조언이 큰 도움이 될 수 있어요.","오늘 내린 결정이 앞으로 큰 전환점이 될 수 있습니다.","차분히 계획을 점검하면 뜻밖의 기회를 발견할 거예요.","긍정적인 에너지가 넘치는 하루, 자신감을 가지세요.","가까운 사람과의 대화에서 중요한 힌트를 얻게 됩니다.","작은 실수에 연연하지 말고 다음 걸음에 집중하세요.","여행이나 이동과 관련해 좋은 기운이 따르는 날입니다.","꾸준함이 빛을 발하는 시기, 하던 일을 계속 밀고 나가세요.","예상치 못한 곳에서 도움의 손길을 받게 될 수 있어요.","감정 기복이 있을 수 있지만 곧 평온을 되찾습니다.","새로운 취미나 배움이 활력을 불어넣어 줄 거예요.","인내심을 갖고 기다리면 원하는 답을 얻게 됩니다.","오늘은 나 자신을 칭찬하고 돌보기 좋은 날입니다."];
const items = ["우산","손목시계","노란색 머그컵","책 한 권","동전 지갑","향초","운동화","손편지","식물 화분","이어폰","체크무늬 스카프","은색 반지","커피 원두","다이어리","선글라스","귤","손거울","열쇠고리","따뜻한 양말","작은 인형"];
const colors = ["빨강","주황","노랑","초록","파랑","남색","보라","하양","검정","핑크"];
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
const card = document.getElementById('card');
const btn = document.getElementById('btn');
let flipped = false;
function draw(){
  if(!flipped){
    document.getElementById('fortune').textContent = pick(fortunes);
    document.getElementById('lucky').textContent = pick(items)+' / '+pick(colors);
    card.classList.add('flipped');
    flipped = true;
    btn.textContent = '다시 뽑기';
  } else {
    card.classList.remove('flipped');
    setTimeout(()=>{
      document.getElementById('fortune').textContent = pick(fortunes);
      document.getElementById('lucky').textContent = pick(items)+' / '+pick(colors);
      card.classList.add('flipped');
      flipped = true;
    }, 420);
  }
}
document.getElementById('scene').addEventListener('click', draw);
btn.addEventListener('click', draw);
</script>
</body>
</html>
